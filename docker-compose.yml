services:
  app:
    image: ${HRP_IMAGE:-httprunnerplatform:local}
    container_name: httprunnerplatform
    restart: unless-stopped
    ports:
      - "${HRP_PORT:-8080}:8080"
    environment:
      HRP_PLATFORM_CONFIG: /app/configs/config.yaml
      HRP_PLATFORM_LOG_LEVEL: info
    volumes:
      - hrp-data:/app/data                         # 命名卷：数据库 + 工作区 + 报告
      - ./deploy/config.yaml:/app/configs/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  hrp-data:
