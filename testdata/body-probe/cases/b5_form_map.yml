config:
    name: "BODY-form-map"
    verify: false
teststeps:
-
    name: "data as map plus explicit form content-type"
    request:
        method: POST
        url: $base_url/anything/b5
        headers:
            Content-Type: "application/x-www-form-urlencoded"
        data:
            username: tester
            password: "123"
    validate:
        - eq: ["status_code", 200]
