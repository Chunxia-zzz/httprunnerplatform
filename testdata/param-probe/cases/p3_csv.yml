config:
    name: "PARAM-csv-parameterize"
    verify: false
    parameters:
        - parameterize: data/users.csv

teststeps:
    -
        name: "查用户"
        request:
            method: GET
            url: "http://127.0.0.1:8899/get"
            params:
                u: "$username"
                p: "$password"
        validate:
            - eq: ["status_code", 200]
