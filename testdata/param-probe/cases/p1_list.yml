config:
    name: "PARAM-list-inline"
    verify: false
    parameters:
        username: ["alice", "bob", "carol"]

teststeps:
    -
        name: "查用户"
        request:
            method: GET
            url: "http://127.0.0.1:8899/get"
            params:
                u: "$username"
        validate:
            - eq: ["status_code", 200]
