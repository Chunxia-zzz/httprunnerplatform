# 流水线门槛：docs/项目进度检查报告.md 建议二（CI 固化本轮检查）+ P0/P1 改进。
#
# 结构（与 Makefile 的 make check、本地 bash scripts/check.sh 同源）：
#   backend  —— 双 OS 矩阵（ubuntu + windows）：gofmt / vet / test -cover / 覆盖率门禁
#   frontend —— npm ci / ESLint / vitest / build（含 vue-tsc）/ 产物归档
#   security —— gitleaks 全历史密钥扫描
#
# P0：路径过滤（纯文档改动不跑）、Go 缓存、前端构建进 CI。
# P1：OS 矩阵（今晚教训：Windows 绿 ≠ Linux 绿，反过来也一样）、
#     覆盖率门禁（只能涨不能跌）、gitleaks。
name: check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# 连续 push 时排队而不是并行（image job 产出的 latest 不被旧 run 覆盖）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    strategy:
      # 一个 OS 失败不取消另一个：双平台的信号都要拿全。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # windows runner 默认是 pwsh，步骤里全是 bash 语法，统一成 bash。
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt -l（有任何未格式化文件即失败）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test -cover
        run: go test -cover ./...

      - name: 覆盖率门禁（各包不得低于既有水位）
        run: bash scripts/coverage-gate.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（npm ci 按 lock 精确安装）
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 前端单测（vitest）
        run: npm test

      - name: 前端构建（vue-tsc + vite build）
        run: npm run build

      - name: 上传构建产物（7 天可下载试玩）
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks 扫 push 的全量提交历史需要完整 clone。
          fetch-depth: 0

      - name: gitleaks 密钥泄漏扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # ⭐ 门禁：三组检查 job 全部成功才会执行 —— 检查失败就不产出镜像
    needs: [backend, frontend, security]
    # 只在 main 的 push 上构建发布；PR 只跑检查
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        name: 计算镜像名（GHCR 要求全小写）
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.short }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像冒烟（起容器 → healthz）
        run: |
          img="${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker run -d --name smoke -p 8080:8080 "$img"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/healthz; then echo; echo "healthz OK"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
